presets:
  quality_compounder:
    description: "ROE > 15%, D/E < 1.0, FCF > 0, Revenue CAGR 5yr > 10%"
    filters:
      return_on_equity_pct: {min: 15}
      debt_to_equity: {max: 1.0}
      fcf: {min: 0}
      revenue_cagr_5yr: {min: 10}

  value_pick:
    description: "P/E < 20, P/B < 3.0, D/E < 2.0, Dividend Yield > 1%"
    filters:
      pe_ratio: {max: 20}
      pb_ratio: {max: 3.0}
      debt_to_equity: {max: 2.0}
      dividend_yield_pct: {min: 1}

  growth_accelerator:
    description: "PAT CAGR 5yr > 20%, Revenue CAGR 5yr > 15%, D/E < 2.0"
    filters:
      pat_cagr_5yr: {min: 20}
      revenue_cagr_5yr: {min: 15}
      debt_to_equity: {max: 2.0}

  dividend_champion:
    description: "Dividend Yield > 2%, Dividend Payout < 80%, FCF > 0"
    filters:
      dividend_yield_pct: {min: 2}
      dividend_payout_pct: {max: 80}
      fcf: {min: 0}

  debt_free_blue_chip:
    description: "D/E = 0, ROE > 12%, Revenue > 5000 Crore"
    filters:
      debt_to_equity: {eq: 0}
      return_on_equity_pct: {min: 12}
      revenue: {min: 5000}

  turnaround_watch:
    description: "Revenue CAGR 3yr > 10%, FCF positive in latest year, D/E declining"
    filters:
      revenue_cagr_3yr: {min: 10}
      fcf_latest_positive: {equals: true}
      debt_to_equity_declining: {equals: true}

metrics:
  - return_on_equity_pct
  - return_on_capital_employed_pct
  - net_profit_margin_pct
  - fcf
  - cfo_pat_ratio
  - fcf_positive_flag
  - revenue_cagr_5yr
  - pat_cagr_5yr
  - debt_to_equity
  - interest_coverage
  - asset_turnover
